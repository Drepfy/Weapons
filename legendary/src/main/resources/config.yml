# Legendary Weapons: four PvP weapons, each with an ability and a passive. After editing, run
# /legendary reload.
#
# Shift + F (F is the swap-offhand key) uses the weapon's ability; plain F swaps hands as usual.
# The passive works on its own on every hit. The weapons only ever affect other players.
# Times: 8s, 2.5s, 1m, 30d. Damage and health: in hearts (1 = one heart).
config-version: 7
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

# Which key uses the ability:
#   offhand     - Shift + F. The weapon stays in your hand (it is not swapped).
#   right-click - sneak + right-click.
#   both        - either.
# The lore shows the right key by itself ({sneak-key}).
controls: offhand

# Only one of each weapon can exist. /legendary give refuses a second Katana while the first
# is still around; remove it first (/legendary remove), or give a new one if it was lost.
one-of-each: true

# Mark a weapon as lost (and tell staff) when it is no longer in its holder's inventory or on
# the ground, so it can be given out again. Off: a weapon stays registered to its last holder
# until staff remove it (/legendary remove * <weapon>). Copies are deleted either way.
mark-lost: false

# Legendaries always drop on the ground when their holder dies, even with keepInventory on,
# so they can be won. They never go into grave or death-chest plugins either way.
# false = they follow keepInventory (kept when it is on, dropped on the ground when it is off).
drop-on-death: true

# Stops a legendary being passed between accounts of the same person (alts used as storage):
# a weapon dropped by, or taken from, an account cannot be picked up by another account that
# joined from the same IP address. Give a player legendary.bypass.alts to allow it (siblings).
alt-protection:
  enabled: true
  # How long a player's IP addresses are remembered (only salted hashes are stored).
  remember-ip: 30d
  # An address used by more accounts than this is a shared network (school, hotel): ignored.
  max-accounts-per-ip: 3

# Commands that sell or list the held item (shops, auction houses): refused while a legendary
# is in either hand. Other items can still be sold. Commands that sell the whole inventory
# (sellall, sell all) are refused while carrying a legendary anywhere.
# Matched against the start of the command, without the slash.
blocked-commands:
  - "ah sell"
  - "ah list"
  - "auction sell"
  - "auction list"
  - "auctionhouse sell"
  - "auctionhouse list"
  - "sell"
  - "sellhand"
  - "sellall"

# Draw, Crush and Reap only go off on a full-strength hit (the attack bar at 90% or more), and so
# does Heavy's knock-down: spam-clicking does not use them up. false = any hit counts.
full-strength-hits: true

# The extra damage of the abilities and passives goes straight through armour and Protection:
# 2 hearts take 2 hearts, whatever the target wears (Resistance, absorption hearts and totems
# still count). It never knocks back and never gets in the way of the next sword hit.
# false = armour reduces it like a sword hit.
true-damage: true

# Sword and axe hits with a legendary do this many times their normal damage (1.25 = 25% more;
# 1 = like any netherite weapon). The {attack} lore line shows the result. The extra damage of
# the abilities is set on its own, below.
melee-damage: 1.25

display:
  # A boss bar for each ability that is recharging: its name and how long until it can be used
  # again (the bar fills up as it recharges, and goes away when the ability is ready). The bars
  # stay while you hold something else, as long as the legendary is in your inventory.
  boss-bars: true
  # Also show the bars of abilities that are ready (just their name, a full bar), for the
  # legendary in your hand.
  boss-bars-when-ready: false

# Each weapon: its name and lore ({sneak-key} = the key that uses its ability,
# {<ability>.<setting>} = a value below, such as {draw.cooldown}, {<ability>.name} = the
# ability's name), resource pack looks, enchantments and its ability and passive. The
# enchantments show under the name like on any enchanted item (put a "{enchantments}" line in
# the lore to list them there in the weapon's own style instead). An "{attack}" line shows the
# weapon's real attack damage, Sharpness and melee-damage included (the vanilla tooltip leaves
# Sharpness out). An ability can be renamed with "name:" in its section.
#
# item-model and tooltip-style come from the server resource pack (1.21.4+ clients): the 3D
# model, and the weapon's own tooltip frame. Without the pack, tooltip styles show as a missing
# texture: if players may join without it (require-resource-pack=false), set them to "".
# glint: the enchantment shimmer (always on, like the Heart items; false = never).
weapons:
  katana:
    name: "<gradient:#FFFFFF:#FF2A4A>&lKatana</gradient>"
    custom-model-data: 1001
    item-model: "legendary:katana"
    tooltip-style: "legendary:katana"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      # pink, blue, red, green, yellow, purple or white
      color: red
      text: "&#FF4D6A"
    lore:
      - "&8Legendary Katana"
      - ""
      - "&#FF4D6APassive &8» &f{bleed.name}"
      - "&7Hits make players bleed for {bleed.duration}."
      - "&7Hitting them again starts it over."
      - ""
      - "&#FF4D6A{sneak-key} &8» &f{draw.name} &8({draw.cooldown})"
      - "&7Your next full-strength hit within {draw.window}"
      - "&7cuts deep: the more health they have, the more."
      - ""
      - "{attack}"
    abilities:
      bleed:
        # Passive: a hit on a player makes them bleed for duration, losing damage hearts every
        # interval. Hitting them again starts it over; it never stacks.
        duration: 4s
        damage: 0.5
        interval: 1s
      draw:
        cooldown: 25s
        # For window, the next full-strength hit on a player cuts for extra damage: percent of the
        # health they have left (0.3 = 30%), at least min and at most max hearts. It is used up
        # only when it lands.
        window: 4s
        percent: 0.3
        min: 1
        max: 3.5

  candycane:
    name: "<gradient:#FF3B5C:#FFFFFF:#FF3B5C>&lCandy Cane</gradient>"
    custom-model-data: 1002
    item-model: "legendary:candycane"
    tooltip-style: "legendary:candycane"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: pink
      text: "&#FF7AC3"
    lore:
      - "&8Legendary Candy Cane"
      - ""
      - "&#FF7AC3Passive &8» &f{sticky-sweet.name}"
      - "&7Hits can stick, slowing players for a moment."
      - ""
      - "&#FF7AC3{sneak-key} &8» &f{sugar-trap.name} &8({sugar-trap.cooldown})"
      - "&7Set {sugar-trap.traps} sugar traps round you. Enemies who"
      - "&7step on one are poisoned, dizzy and slowed."
      - ""
      - "{attack}"
    abilities:
      sticky-sweet:
        # Passive: the chance (0.25 = 25%) that a hit gives Slowness I for duration. It never
        # stacks, and the same player cannot be slowed by it again until immunity has passed
        # (counted from when it struck), so hitting faster does not keep them slowed.
        chance: 0.25
        duration: 1.5s
        immunity: 3s
      sugar-trap:
        cooldown: 25s
        # Up to traps traps pop out round you, radius blocks away (only where there is ground
        # and no wall in between), and stay for lifetime. The first enemy to walk over one gets
        # Poison, Nausea and Slowness (level 0 = none), and that trap is gone. Your own traps
        # never catch you.
        traps: 5
        radius: 2.5
        lifetime: 8s
        poison-level: 1
        poison-duration: 4s
        nausea-duration: 4s
        slow-level: 1
        slow-duration: 1s

  crush:
    name: "<gradient:#EAF6FF:#4FB4FF>&lCrush</gradient>"
    custom-model-data: 1004
    item-model: "legendary:crush"
    tooltip-style: "legendary:crush"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      efficiency: 5
      fortune: 3
    boss-bar:
      color: blue
      text: "&#6FC3FF"
    lore:
      - "&8Legendary War Axe"
      - ""
      - "&#6FC3FFPassive &8» &f{heavy.name}"
      - "&7Hits knock further. Catch a player in the"
      - "&7air to knock them down."
      - ""
      - "&#6FC3FF{sneak-key} &8» &f{crush.name} &8({crush.cooldown})"
      - "&7Your next full-strength hit slams them into"
      - "&7the ground. The higher they were, the harder."
      - ""
      - "{attack}"
    abilities:
      heavy:
        # Passive: axe hits knock players knockback times as far. A full-strength hit on a
        # player at least airborne blocks above the ground knocks them down (slam = how fast)
        # and does damage hearts more.
        knockback: 1.3
        airborne: 0.5
        slam: 0.8
        damage: 0.75
      crush:
        cooldown: 28s
        # For window, the next full-strength hit on a player slams them into the ground: damage
        # hearts, plus damage-per-block for every block they were above the ground, at most
        # max-damage. It is used up only when it lands.
        window: 10s
        slam: 1.6
        damage: 0.5
        damage-per-block: 0.75
        max-damage: 4

  reaper:
    name: "<gradient:#C8FFF0:#5AFFD2:#7B4FD0>&lReaper</gradient>"
    custom-model-data: 1003
    item-model: "legendary:reaper"
    tooltip-style: "legendary:reaper"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: green
      text: "&#5AFFD2"
    lore:
      - "&8Legendary Reaper Blade"
      - ""
      - "&#5AFFD2Passive &8» &f{execution.name}"
      - "&7More damage to players below {execution.below} hearts."
      - ""
      - "&#5AFFD2{sneak-key} &8» &f{reap.name} &8({reap.cooldown})"
      - "&7Your next full-strength hit on a player below"
      - "&7{reap.below} hearts reaps them for heavy damage."
      - ""
      - "{attack}"
    abilities:
      execution:
        # Passive: hits on a player below below hearts do damage hearts more.
        below: 6
        damage: 0.75
      reap:
        cooldown: 30s
        # For window, the next full-strength hit on a player below below hearts does damage
        # hearts more. Hits on healthier players do not use it up. It is ordinary damage: it
        # never kills outright and totems still save.
        window: 8s
        below: 8
        damage: 3.5

# Sounds: "<sound> [volume] [pitch]" (vanilla Minecraft sounds, so everyone hears them, pack or
# not). One sound when an ability is used and one when it lands; hits, bleeding and taking a
# weapon in hand make no sound. Set one to [] to silence it, or add your own: several play
# together.
sounds:
  draw: ["item.armor.equip_chain 1 0.6"]
  draw-strike: ["item.trident.hit 1 0.7"]
  sugar-trap: ["block.honey_block.place 1 1.3"]
  sugar-trap-trigger: ["block.honey_block.break 1 1.1"]
  crush: ["item.armor.equip_netherite 1 0.6"]
  crush-impact: ["item.mace.smash_ground_heavy 1 0.8"]
  reap: ["particle.soul_escape 1 0.7"]
  reap-strike: ["entity.player.attack.sweep 1 0.5"]
  # Getting a legendary.
  received: ["ui.toast.challenge_complete 0.6 1.2"]

# {ability}, {time}, {player}, {weapon}... are filled in. Set a message to "" to turn it off.
messages:
  # The boss bars ({color} = the weapon's boss-bar text colour).
  bar-ready: "{color}&l{ability}"
  bar-cooldown: "{color}{ability} &8» &f{time}"
  bar-active: "{color}&l{ability} &8» &e{time}"
  # How {enchantments} lists them in the lore.
  lore-enchantment: "&#AFB6C2{name} &f{level}"
  lore-separator: "  &8✦  "
  lore-unbreakable: "&#AFB6C2Unbreakable"
  # How {attack} shows the weapon's attack damage (Sharpness included) and speed, like vanilla.
  lore-attack-header: "&7When in Main Hand:"
  lore-attack-damage: " &2{damage} Attack Damage"
  lore-attack-speed: " &2{speed} Attack Speed"
  # In chat.
  no-room: "&7There is no room for a trap here."
  retired: "&c{weapon} &cno longer exists and was taken away. Ask staff for a new legendary."
  storage-blocked: "&cLegendaries can't go in containers."
  placing-blocked: "&cLegendaries can't be placed there."
  bundle-blocked: "&cLegendaries can't go in bundles."
  command-blocked: "&cYou can't use that while carrying a legendary."
  alt-blocked: "&cYou can't pick this up: legendaries can't move between your own accounts."
  copy-removed: "&cA copy of {weapon} &cwas removed. Legendaries can't be duplicated."
  revoked: "&c{weapon} &cwas taken away by staff."
  container-returned: "{weapon} &ewas moved from storage to your inventory."
  received: "&6You got {weapon}&6!"
  dropped-at-feet: "&eYour inventory is full: {weapon} &ewas dropped at your feet."
  # Staff.
  alert: "&8[&6Legendary&8] &7{message}"
  given: "&aGave {weapon} &ato &f{player}&a. &7(#{id})"
  give-exists: "&c{weapon} &calready exists: {where}. Remove it first with &f/legendary remove {holder} {key}&c."
  removed: "&aRemoved {weapon} &a(#{id}) from &f{player}&a."
  removed-offline: "&aTook {weapon} &a(#{id}) from &f{player}&a. It disappears from their inventory when they next join."
  removed-everywhere: "&aRemoved {weapon} &aeverywhere. &7({count} found)"
  removed-none: "&c{player} does not have {weapon}&c."
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  unknown-weapon: "&cUnknown weapon: &f{weapon}&c. Weapons: &f{weapons}"
  reloaded: "&aLegendary reloaded. &7({warnings} warning(s), see console)"
