# Legendary Weapons. After editing, run /legendary reload.
#
# Controls: F (the swap-offhand key) uses a weapon's first ability, Shift + F its second. Pressing
# Shift + F again while Iron Bastion or Sugar Rush is going ends it early (the release or burst
# happens straight away).
# Times: 8s, 2.5s, 1m, 30d.
config-version: 6
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

# Which keys use the abilities:
#   offhand     - F and Shift + F. The weapon stays in your hand (it is not swapped).
#   right-click - right-click and sneak + right-click (how 1.0 worked).
#   both        - either.
# The lore shows the right keys by itself ({key} and {sneak-key}).
controls: offhand

# Only one of each weapon can exist. /legendary give refuses a second Kurogane while the first
# is still around; remove it first (/legendary remove), or give a new one if it was lost.
one-of-each: true

# Mark a weapon as lost (and tell staff) when it is no longer in its holder's inventory or on
# the ground, so it can be given out again. Off: a weapon stays registered to its last holder
# until staff remove it (/legendary remove * <weapon>). Copies are deleted either way.
mark-lost: false

# Legendaries always drop on the ground when their holder dies, even with keepInventory on,
# so they can be won. They never go into grave or death-chest plugins either way.
# false = they follow keepInventory (kept when it is on, dropped on the ground when it is off).
drop-on-death: true

# Stops a legendary being passed between accounts of the same person (alts used as storage):
# a weapon dropped by, or taken from, an account cannot be picked up by another account that
# joined from the same IP address. Give a player legendary.bypass.alts to allow it (siblings).
alt-protection:
  enabled: true
  # How long a player's IP addresses are remembered (only salted hashes are stored).
  remember-ip: 30d
  # An address used by more accounts than this is a shared network (school, hotel): ignored.
  max-accounts-per-ip: 3

# Commands that sell or list the held item (shops, auction houses): refused while a legendary
# is in either hand. Other items can still be sold. Commands that sell the whole inventory
# (sellall, sell all) are refused while carrying a legendary anywhere.
# Matched against the start of the command, without the slash.
blocked-commands:
  - "ah sell"
  - "ah list"
  - "auction sell"
  - "auction list"
  - "auctionhouse sell"
  - "auctionhouse list"
  - "sell"
  - "sellhand"
  - "sellall"

# What the abilities hit besides players: hostile (monsters), all (every mob) or none.
hit-mobs: hostile

# Ability damage goes straight through armour and Protection: damage 8 takes 4 hearts, whatever
# the target wears (Resistance and absorption hearts still count). Sword and axe hits are not
# changed. false = armour reduces ability damage like it reduces a sword hit.
true-damage: true

# Sword and axe hits with a legendary do this many times their normal damage (1.25 = 25% more;
# 1 = like any netherite weapon). The {attack} lore line shows the result. Ability damage below
# is set on its own.
melee-damage: 1.25

display:
  # A boss bar for each ability that is recharging: its name and how long until it can be used
  # again (the bar fills up as it recharges, and goes away when the ability is ready). The bars
  # stay while you hold something else, as long as the legendary is in your inventory.
  boss-bars: true
  # Also show the bars of abilities that are ready (just their name, a full bar), for the
  # legendary in your hand.
  boss-bars-when-ready: false

# Each weapon: its name and lore ({key} / {sneak-key} = the keys that use its abilities,
# {<ability>.<setting>} = a value below, such as {phantom-step.cooldown}, {<ability>.name} = the
# ability's name), resource pack looks, enchantments and abilities. The enchantments show under
# the name like on any enchanted item (put a "{enchantments}" line in the lore to list them there
# in the weapon's own style instead). An "{attack}" line shows the weapon's real attack damage,
# Sharpness and melee-damage included (the vanilla tooltip leaves Sharpness out). Damage is in
# health points (2 = one heart); see true-damage above. An ability can be renamed with "name:" in
# its section.
#
# item-model and tooltip-style come from the server resource pack (1.21.4+ clients): the 3D
# model, and the weapon's own tooltip frame. Without the pack, tooltip styles show as a missing
# texture: if players may join without it (require-resource-pack=false), set them to "".
# glint: the enchantment shimmer (always on, like the Heart items; false = never).
weapons:
  kurogane:
    name: "<gradient:#F5F5F5:#C21E3A>&lKurogane</gradient>"
    custom-model-data: 1001
    item-model: "legendary:kurogane"
    tooltip-style: "legendary:kurogane"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      # pink, blue, red, green, yellow, purple or white
      color: red
      text: "&#FF4D6A"
    lore:
      - "&8Legendary Katana"
      - ""
      - "&#FF4D6APassive &8» &f{crimson-hunger.name}"
      - "&7Hits can make them bleed. Hitting a"
      - "&7bleeding enemy heals you."
      - ""
      - "&#FF4D6A{key} &8» &f{phantom-step.name} &8({phantom-step.cooldown})"
      - "&7Vanish forward through enemies. Everyone"
      - "&7you pass is cut and bleeds."
      - ""
      - "&#FF4D6A{sneak-key} &8» &f{crimson-tempest.name} &8({crimson-tempest.cooldown})"
      - "&7For {crimson-tempest.duration}, every swing sends out"
      - "&7a crimson crescent."
      - ""
      - "{attack}"
    abilities:
      phantom-step:
        cooldown: 21s
        # How far you vanish (you stop before walls) and how wide the cut along the way is.
        range: 10
        width: 1.8
        damage: 7.5
        # Bleeding: this much damage every second, for this long (0 = none).
        bleed-damage: 1.25
        bleed-duration: 3s
        # Speed afterwards (level 0 = none).
        speed-level: 3
        speed-duration: 3s
      crimson-tempest:
        cooldown: 27s
        # For duration, each sword swing also sends a crescent range blocks forward (at most
        # one every gap). It cuts everyone within width of its path. Speed while it lasts.
        duration: 5s
        range: 7
        width: 2.4
        damage: 5
        gap: 0.5s
        speed-level: 2
      crimson-hunger:
        # Passive: the chance (0.25 = 25%) that a sword hit makes the target bleed, and the
        # health you get back when you hit someone who is already bleeding (2 = one heart).
        chance: 0.25
        bleed-damage: 1.25
        bleed-duration: 3s
        heal: 1

  sugarcrash:
    name: "<gradient:#FF3B5C:#FFFFFF:#FF3B5C>&lSugarcrash</gradient>"
    custom-model-data: 1002
    item-model: "legendary:sugarcrash"
    tooltip-style: "legendary:sugarcrash"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: pink
      text: "&#FF7AC3"
    lore:
      - "&8Legendary Candy Scythe"
      - ""
      - "&#FF7AC3Passive &8» &f{sugar-high.name}"
      - "&7Speed I while held. Hits slow them down."
      - ""
      - "&#FF7AC3{key} &8» &f{candy-reaper.name} &8({candy-reaper.cooldown})"
      - "&7Throw the scythe. It cuts on the way out"
      - "&7and drags them back to you on the return."
      - ""
      - "&#FF7AC3{sneak-key} &8» &f{sugar-rush.name} &8({sugar-rush.cooldown})"
      - "&7Charge where you look, ramming everyone."
      - "&7Ends in a candy blast. Arrows bounce off."
      - ""
      - "{attack}"
    abilities:
      candy-reaper:
        cooldown: 19s
        # How far the scythe flies (it turns back at walls) and how fast, out and back
        # (blocks per tick). Each target is cut once going out and once coming back.
        range: 18
        speed: 1.3
        return-speed: 1.6
        damage: 6.25
        # How hard the return cut drags them towards you (0 = not at all).
        pull: 0.9
      sugar-rush:
        cooldown: 33s
        # You charge where you look for duration, at speed blocks per tick. Everyone you run
        # into is hit once and thrown aside. Press again to end it early.
        duration: 3s
        speed: 0.9
        damage: 6.25
        knockback: 0.9
        # The candy blast at the end (radius 0 = none).
        burst-radius: 4
        burst-damage: 5
      sugar-high:
        # Passive: Speed while the scythe is in your hand (1 = Speed I, 0 = none), and
        # Slowness for whoever a scythe hit lands on (level 0 = none).
        speed-level: 1
        slow-level: 1
        slow-duration: 1.5s

  wyrmfang:
    name: "<gradient:#B8FFD0:#2FD47A:#E8C25A>&lWyrmfang</gradient>"
    custom-model-data: 1003
    item-model: "legendary:wyrmfang"
    tooltip-style: "legendary:wyrmfang"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: green
      text: "&#3DE08A"
    lore:
      - "&8Legendary Dragon Greatsword"
      - ""
      - "&#3DE08APassive &8» &f{venom-fang.name}"
      - "&7Every hit poisons the target."
      - ""
      - "&#3DE08A{key} &8» &f{wyrm-lunge.name} &8({wyrm-lunge.cooldown})"
      - "&7Leap forward. The first enemy you reach"
      - "&7is seized, thrown up and slowed."
      - ""
      - "&#3DE08A{sneak-key} &8» &f{dragons-breath.name} &8({dragons-breath.cooldown})"
      - "&7Breathe green dragon fire where you look,"
      - "&7burning and poisoning everyone in it."
      - ""
      - "{attack}"
    abilities:
      wyrm-lunge:
        cooldown: 25s
        # How hard the leap throws you forward and up (no fall damage after it), and how long
        # it can seize someone for.
        forward: 1.5
        up: 0.45
        reach-time: 1.25s
        # Whoever is seized: damage, how high they are thrown and Slowness (level 0 = none).
        damage: 10
        launch: 0.8
        slow-level: 3
        slow-duration: 2s
      dragons-breath:
        cooldown: 33s
        # The fire reaches range blocks in a cone of angle degrees either side of where you
        # look (it does not go through walls). Everyone in it takes damage every interval.
        duration: 2s
        range: 8
        angle: 35
        interval: 0.25s
        damage: 1.25
        poison-level: 2
        poison-duration: 3s
      venom-fang:
        # Passive: Poison for whoever a sword hit lands on (level 0 = none).
        poison-level: 2
        poison-duration: 2s

  gravebreaker:
    name: "<gradient:#E2E2E2:#E0475A>&lGravebreaker</gradient>"
    custom-model-data: 1004
    item-model: "legendary:gravebreaker"
    tooltip-style: "legendary:gravebreaker"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      efficiency: 5
      fortune: 3
    boss-bar:
      color: yellow
      text: "&#FF8A3D"
    lore:
      - "&8Legendary Battle Axe"
      - ""
      - "&#FF8A3DPassive &8» &f{headsman.name}"
      - "&7More damage to weak players. Kills"
      - "&7give you Regeneration."
      - ""
      - "&#FF8A3D{key} &8» &f{earthsplitter.name} &8({earthsplitter.cooldown})"
      - "&7Split the ground in front of you. Rocks"
      - "&7burst up and throw everyone in the way."
      - ""
      - "&#FF8A3D{sneak-key} &8» &f{iron-bastion.name} &8({iron-bastion.cooldown})"
      - "&7Brace: take less damage and no knockback."
      - "&7Then release it all as a shockwave."
      - ""
      - "{attack}"
    abilities:
      earthsplitter:
        cooldown: 23s
        # The crack runs range blocks forward along the ground. Everyone within width of it
        # is hit once, thrown up and slowed (level 0 = none).
        range: 14
        width: 1.6
        damage: 10
        launch: 1.0
        slow-level: 2
        slow-duration: 2s
      iron-bastion:
        cooldown: 33s
        # For duration you have Resistance (level 0 = none) and cannot be knocked back. The
        # damage you take is stored (up to stored-cap) and added to the shockwave at the end.
        # Press again to release it early.
        duration: 4s
        resistance-level: 3
        radius: 6
        damage: 6.25
        stored-cap: 6.25
        knockback: 1.0
        lift: 0.5
      headsman:
        # Passive: axe hits on players below threshold of their health (0.4 = 40%) do bonus
        # more damage (0.3 = +30%). Killing a player with the axe in hand gives Regeneration.
        threshold: 0.4
        bonus: 0.3
        regen-level: 2
        regen-duration: 4s

  starforged:
    name: "<gradient:#FFE29A:#6FD6FF:#8A5CFF>&lStarforged</gradient>"
    custom-model-data: 1005
    item-model: "legendary:starforged"
    tooltip-style: "legendary:starforged"
    glint: true
    unbreakable: true
    enchantments:
      sharpness: 7
      efficiency: 5
      fortune: 3
    boss-bar:
      color: blue
      text: "&#6FD6FF"
    lore:
      - "&8Legendary Celestial Axe"
      - ""
      - "&#6FD6FFPassive &8» &f{starlight.name}"
      - "&7More damage to enemies in the air."
      - ""
      - "&#6FD6FF{key} &8» &f{star-lance.name} &8({star-lance.cooldown})"
      - "&7Throw a star. The first enemy it hits is"
      - "&7pinned, slowed and lit up for everyone."
      - ""
      - "&#6FD6FF{sneak-key} &8» &f{celestial-prison.name} &8({celestial-prison.cooldown})"
      - "&7Trap everyone near you in a ring of stars."
      - "&7No escape, then the stars come crashing in."
      - ""
      - "{attack}"
    abilities:
      star-lance:
        cooldown: 29s
        # How far the star flies and how fast (blocks per tick). It bursts at walls.
        range: 30
        speed: 2
        damage: 11.25
        # Slowness for whoever it hits (level 0 = none), and how long they glow (seen through
        # walls by everyone).
        slow-level: 4
        slow-duration: 2s
        glow: 5s
      celestial-prison:
        cooldown: 40s
        # Everyone within radius is trapped for duration: walking out pushes them back in, and
        # ender pearls and chorus fruit cannot take them out. Then the stars collapse: damage
        # and a launch for everyone still inside.
        radius: 6
        duration: 3s
        damage: 12.5
        launch: 0.7
      starlight:
        # Passive: axe hits on an enemy that is in the air do bonus more damage (0.3 = +30%).
        bonus: 0.3

# Sounds: "<sound> [volume] [pitch]" (vanilla Minecraft sounds, so everyone hears them, pack or
# not). Only one sound when an ability is used and one for its big moment. Hits, bleeding and
# taking a weapon in hand make no sound. Set one to [] to silence it, or add your own: several
# play together.
sounds:
  phantom-step: ["entity.player.attack.sweep 1 0.7"]
  crimson-tempest: ["item.trident.return 0.9 0.7"]
  candy-reaper: ["item.trident.throw 1 0.8"]
  sugar-rush: ["entity.breeze.wind_burst 0.9 1.1"]
  wyrm-lunge: ["entity.ender_dragon.flap 1 1.2"]
  dragons-breath: ["entity.ender_dragon.shoot 1 0.9"]
  earthsplitter: ["item.mace.smash_ground_heavy 1 0.8"]
  iron-bastion: ["item.armor.equip_netherite 1 0.6"]
  iron-bastion-release: ["entity.generic.explode 0.8 0.9"]
  star-lance: ["block.beacon.activate 0.9 1.6"]
  celestial-prison: ["block.respawn_anchor.charge 1 0.8"]
  celestial-prison-collapse: ["entity.firework_rocket.large_blast 1 0.8"]
  # Getting a legendary.
  received: ["ui.toast.challenge_complete 0.6 1.2"]

# {ability}, {time}, {player}, {weapon}... are filled in. Set a message to "" to turn it off.
messages:
  # The boss bars ({color} = the weapon's boss-bar text colour).
  bar-ready: "{color}&l{ability}"
  bar-cooldown: "{color}{ability} &8» &f{time}"
  bar-active: "{color}&l{ability} &8» &e{time}"
  # How {enchantments} lists them in the lore.
  lore-enchantment: "&#AFB6C2{name} &f{level}"
  lore-separator: "  &8✦  "
  lore-unbreakable: "&#AFB6C2Unbreakable"
  # How {attack} shows the weapon's attack damage (Sharpness included) and speed, like vanilla.
  lore-attack-header: "&7When in Main Hand:"
  lore-attack-damage: " &2{damage} Attack Damage"
  lore-attack-speed: " &2{speed} Attack Speed"
  # In chat.
  storage-blocked: "&cLegendaries can't go in containers."
  placing-blocked: "&cLegendaries can't be placed there."
  bundle-blocked: "&cLegendaries can't go in bundles."
  command-blocked: "&cYou can't use that while carrying a legendary."
  alt-blocked: "&cYou can't pick this up: legendaries can't move between your own accounts."
  copy-removed: "&cA copy of {weapon} &cwas removed. Legendaries can't be duplicated."
  revoked: "&c{weapon} &cwas taken away by staff."
  container-returned: "{weapon} &ewas moved from storage to your inventory."
  received: "&6You got {weapon}&6!"
  dropped-at-feet: "&eYour inventory is full: {weapon} &ewas dropped at your feet."
  # Staff.
  alert: "&8[&6Legendary&8] &7{message}"
  given: "&aGave {weapon} &ato &f{player}&a. &7(#{id})"
  give-exists: "&c{weapon} &calready exists: {where}. Remove it first with &f/legendary remove {holder} {key}&c."
  removed: "&aRemoved {weapon} &a(#{id}) from &f{player}&a."
  removed-offline: "&aTook {weapon} &a(#{id}) from &f{player}&a. It disappears from their inventory when they next join."
  removed-everywhere: "&aRemoved {weapon} &aeverywhere. &7({count} found)"
  removed-none: "&c{player} does not have {weapon}&c."
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  unknown-weapon: "&cUnknown weapon: &f{weapon}&c. Weapons: &f{weapons}"
  reloaded: "&aLegendary reloaded. &7({warnings} warning(s), see console)"
