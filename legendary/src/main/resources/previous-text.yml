# Defaults older versions shipped that the sections above do not have yet (found by
# comparing every version).
history:
  # 1.0 to 1.6: /auction list and /auctionhouse list (the server's /ah script) were missing.
  blocked-commands: ["ah sell", "ah list", "auction sell", "auctionhouse sell", "sell", "sellhand", "sellall"]
