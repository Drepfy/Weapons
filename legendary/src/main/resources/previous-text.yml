# The wording older versions shipped with, one section per version. When a server's
# config.yml still has one of these texts exactly, it is switched to the new default on start
# (texts that were changed by hand are left alone). Not a config file: nothing here needs editing.
v1_0_1:
  weapons:
    kurogane:
      lore:
        - "&8Legendary Katana"
        - ""
        - "&7&o\"Steel folded a thousand times;"
        - "&7&oit remembers every cut.\""
        - ""
        - "&c&lRIGHT-CLICK &8» &fCrescent Draw"
        - "&7A crescent slash flies {crescent-draw.range} blocks,"
        - "&7cutting and knocking back what it passes."
        - "&8Cooldown: &7{crescent-draw.cooldown}"
        - ""
        - "&c&lPASSIVE &8» &fUnbroken Edge"
        - "&7Fully charged hits on the same target build"
        - "&7Edge, up to {unbroken-edge.max-stacks}: &f+{unbroken-edge.damage-per-stack}% &7damage each."
        - "&7It fades after {unbroken-edge.window} without a hit."
        - "&7Crescent Draw spends it: &f+{crescent-draw.damage-per-edge} &7damage a stack."
        - ""
        - "&6&lLEGENDARY &8#{id}"
    sugarcrash:
      lore:
        - "&8Legendary Candy Cane"
        - ""
        - "&7&o\"Sweet on the outside."
        - "&7&oShattering on the inside.\""
        - ""
        - "&d&lRIGHT-CLICK &8» &fSugar Rush"
        - "&7Overload on sugar for {sugar-rush.duration}: faster"
        - "&7movement and attacks, and a candy trail."
        - "&8Cooldown: &7{sugar-rush.cooldown} after it ends"
        - ""
        - "&d&lSNEAK + RIGHT-CLICK &8» &fSweet Shock"
        - "&7Strike the ground: players within"
        - "&7{sweet-shock.radius} blocks are knocked back and slowed."
        - "&8Cooldown: &7{sweet-shock.cooldown}"
        - ""
        - "&6&lLEGENDARY &8#{id}"
    riftblade:
      lore:
        - "&8Legendary Void Sword"
        - ""
        - "&7&o\"Space is only a suggestion.\""
        - ""
        - "&5&lRIGHT-CLICK &8» &fRift Slash"
        - "&7Tear open a rift that travels {rift-slash.range}"
        - "&7blocks, hurting and throwing back"
        - "&7whoever it passes through."
        - "&8Cooldown: &7{rift-slash.cooldown}"
        - ""
        - "&5&lSNEAK + RIGHT-CLICK &8» &fRift Recall"
        - "&7Mark where you stand, then use it again"
        - "&7within {rift-recall.window} to return to the mark."
        - "&7Everyone can see the mark."
        - "&8Cooldown: &7{rift-recall.cooldown}"
        - ""
        - "&6&lLEGENDARY &8#{id}"
    gravebreaker:
      lore:
        - "&8Legendary Executioner's Axe"
        - ""
        - "&7&o\"Every grave it opens, it fills.\""
        - ""
        - "&4&lRIGHT-CLICK &8» &fEarthsplitter"
        - "&7Smash the ground: a cracking shockwave"
        - "&7runs {earthsplitter.range} blocks forward, throwing players"
        - "&7up and weighing them down with Mining Fatigue."
        - "&8Cooldown: &7{earthsplitter.cooldown}"
        - ""
        - "&4&lPASSIVE &8» &fExecutioner's Mark"
        - "&7{executioners-mark.hits} hits on the same player mark them for"
        - "&7{executioners-mark.duration}. The next Earthsplitter to hit them"
        - "&7throws them much harder."
        - ""
        - "&6&lLEGENDARY &8#{id}"
    starforged:
      lore:
        - "&8Legendary Celestial Axe"
        - ""
        - "&7&o\"Forged where stars are born.\""
        - ""
        - "&b&lRIGHT-CLICK &8» &fAstral Impact"
        - "&7Call down a star where you look. A circle"
        - "&7warns everyone {astral-impact.warning} before it lands."
        - "&8Cooldown: &7{astral-impact.cooldown}"
        - ""
        - "&b&lSNEAK + RIGHT-CLICK &8» &fGravity Well"
        - "&7Open a gravity field for {gravity-well.duration} that"
        - "&7drags players to its centre, then"
        - "&7bursts outward."
        - "&8Cooldown: &7{gravity-well.cooldown}"
        - ""
        - "&6&lLEGENDARY &8#{id}"
  messages:
    hud-ready: "&a{ability}"
    hud-cooldown: "&7{ability} &c{time}"
    hud-active: "&d{ability} &f{time}"
    hud-separator: "  &8|  "
    hud-edge: "&7Edge {stacks}"
    hud-edge-on: "&b■"
    hud-edge-off: "&8■"
    hud-mark-building: "&7Mark &f{hits}&7/&f{needed}"
    hud-mark: "&4Marked &c{player} &7{time}"
    on-cooldown: "&c{ability} &7is recharging: &f{time}"
    no-target: "&7Nothing to target within {range} blocks."
    rift-marked: "&5Rift marked. &7Sneak + right-click within {time} to return."
    rift-blocked: "&cSomething is blocking your rift mark. The rift collapsed."
    rift-too-far: "&cToo far from your rift mark &7({distance} of {max} blocks)&c."
    rift-failed: "&cThe rift cannot take you back there right now."
    rift-faded: "&7Your rift mark faded."
    marked: "&4You have been marked by the Executioner! &7The next Earthsplitter will throw you much harder. ({time})"
    mark-applied: "&4{player} &cis marked for {time}."
    sugar-rush-end: "&7Sugar Rush wore off."
    storage-blocked: "&cLegendary weapons cannot be put in containers."
    placing-blocked: "&cLegendary weapons cannot be placed there."
    bundle-blocked: "&cLegendary weapons cannot go in bundles."
    command-blocked: "&cYou cannot use that command while carrying a legendary weapon."
    alt-blocked: "&cThis weapon was last held by an account that shares your connection. Legendary weapons cannot be passed between your own accounts."
    copy-removed: "&cA copy of {weapon} &cwas removed: legendary weapons cannot be duplicated."
    revoked: "&c{weapon} &cwas taken away by staff."
    container-returned: "{weapon} &ewas found in storage and moved to your inventory."
    received: "&6You received the legendary weapon {weapon}&6!"
    dropped-at-feet: "&eYour inventory is full, so {weapon} &ewas dropped at your feet."
    alert: "&8[&6Legendary&8] &7{message}"
    given: "&aGave {weapon} &ato &f{player}&a. &7(#{id})"
    give-exists: "&c{weapon} &calready exists: {where}. Remove it first with &f/legendary remove {holder} {key}&c."
    removed: "&aRemoved {weapon} &a(#{id}) from &f{player}&a."
    removed-offline: "&aTook {weapon} &a(#{id}) from &f{player}&a. It disappears from their inventory when they next join."
    removed-everywhere: "&aRemoved {weapon} &aeverywhere. &7({count} found)"
    removed-none: "&c{player} does not have {weapon}&c."
    no-permission: "&cYou do not have permission to do that."
    player-not-found: "&cPlayer not found: &f{player}"
    unknown-weapon: "&cUnknown weapon: &f{weapon}&c. Weapons: &f{weapons}"
    reloaded: "&aLegendary reloaded. &7({warnings} warning(s), see console)"
