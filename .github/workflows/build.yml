name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B package
      - name: Build and test Lifesteal
        run: mvn -B -f lifesteal/pom.xml package
      - name: Build and test Combat
        run: mvn -B -f combat/pom.xml package
      - name: Build and test Legendary
        run: mvn -B -f legendary/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: Vigil
          path: target/Vigil-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Lifesteal
          path: lifesteal/target/Lifesteal-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Combat
          path: combat/target/Combat-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Legendary
          path: legendary/target/Legendary-*.jar
