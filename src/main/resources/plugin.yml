name: Vigil
version: '${project.version}'
main: io.github.drepfy.vigil.VigilPlugin
api-version: '1.20'
description: Server-side anti-cheat with automatic bans, staff alerts and moderation commands.
authors: [Drepfy]
load: POSTWORLD

commands:
  ac:
    description: Anti-cheat staff command (alerts, check, reset, debug, reload).
    usage: /<command> [alerts|check|reset|debug|reload]
    aliases: [anticheat, vigil]
  ban:
    description: Ban a player (optionally for a duration, e.g. 7d).
    usage: /<command> <player> [duration] [reason]
    permission: vigil.ban
  unban:
    description: Unban a player.
    usage: /<command> <player> [reason]
    aliases: [pardon]
    permission: vigil.ban
  mute:
    description: Mute a player (optionally for a duration, e.g. 1h).
    usage: /<command> <player> [duration] [reason]
    permission: vigil.mute
  unmute:
    description: Unmute a player.
    usage: /<command> <player> [reason]
    permission: vigil.mute
  warn:
    description: Warn a player.
    usage: /<command> <player> [reason]
    permission: vigil.warn
  kick:
    description: Kick a player.
    usage: /<command> <player> [reason]
    permission: vigil.kick

permissions:
  vigil.*:
    description: Everything staff can do.
    default: op
    children:
      vigil.alerts: true
      vigil.check: true
      vigil.admin: true
      vigil.ban: true
      vigil.mute: true
      vigil.warn: true
      vigil.kick: true
  vigil.alerts:
    description: See anti-cheat alerts and punishments, and use /ac alerts.
    default: op
  vigil.check:
    description: Use /ac check to see a player's violations, flags and punishments.
    default: op
  vigil.admin:
    description: Use /ac reload, /ac reset and /ac debug.
    default: op
  vigil.ban:
    description: Use /ban and /unban.
    default: op
  vigil.mute:
    description: Use /mute and /unmute.
    default: op
  vigil.warn:
    description: Use /warn.
    default: op
  vigil.kick:
    description: Use /kick.
    default: op
  vigil.protect:
    description: Cannot be punished by staff commands and is never banned automatically (still flagged).
    default: false
  vigil.bypass:
    description: Not checked at all. Only works when anticheat.bypass-permission is true in config.yml.
    default: false
