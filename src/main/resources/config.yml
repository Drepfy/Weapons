# ============================================================
#  Vigil - anti-cheat and moderation for Vanilla SMP
#  Commands: /ac  /ban  /unban  /mute  /unmute  /warn  /unwarn  /kick
#  After editing, run /ac reload.
# ============================================================
config-version: 2

# Shown in front of every message.
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

anticheat:
  enabled: true
  # Staff with vigil.alerts see "Steve has been flagged for Flying".
  alerts: true
  auto-ban:
    enabled: true
    # How long automatic bans last: 1st ban, 2nd ban... (e.g. "7d", "30d, perm").
    duration: 30d, perm
    # {reason} = what was detected, e.g. "Flying".
    reason: "Cheating ({reason})"
    # Tell every player about the ban (staff are always told).
    broadcast: true
    # Leave empty to use Vigil's own bans. To use another ban plugin instead, e.g.:
    # command: "tempban {player} {duration} {reason}"
    command: ""
    # Lightning, an explosion and a large "Banned" title before the cheater is kicked.
    animation: true
  # Creative and spectator players are never checked.
  exempt-creative-and-spectator: true
  # Worlds where nothing is checked.
  disabled-worlds: []
  # Let players with vigil.bypass skip all checks. Off so "*" permissions don't disable the anti-cheat.
  bypass-permission: false
  # Anti x-ray: switches on Paper's own anti-xray once (fake ores hide the real ones from x-ray and ore ESP).
  # Backups are made and a restart is needed. If you turn it off afterwards, Vigil leaves it off.
  setup-paper-anti-xray: true
  # Anti ESP / anti freecam: chests, barrels, shulkers, beds... that a player cannot see are shown as stone
  # to that player until they get close or can see them, and hidden again when out of sight (Paper).
  hide-storage-from-esp: true
  # Anti x-ray in caves: diamonds and ancient debris stay hidden until you are down there and can see them (Paper).
  hide-ores-from-xray: true
  client-check:
    # Kick hacked clients (Meteor, Wurst, LiquidBounce...) that show their name, and world downloaders.
    enabled: true
    # Kick EVERY modded client (Fabric/Forge/Quilt). Blocks Freecam, Tweakeroo, Item Scroller and Meteor,
    # but also harmless mods like Sodium, Iris or minimaps. Lunar/Badlion/vanilla players are not affected.
    block-all-mods: false

  # enabled: turn a check on/off.
  # ban-at: violation level that bans automatically (0 = alert only, never ban; x-ray is a pattern, not proof).
  # Each flag adds 1 and 1 decays per minute, so short false flags never add up.
  checks:
    speed:       {enabled: true, ban-at: 15}
    flight:      {enabled: true, ban-at: 8}
    step:        {enabled: true, ban-at: 8}
    nofall:      {enabled: true, ban-at: 10}
    timer:       {enabled: true, ban-at: 10}
    noslow:      {enabled: true, ban-at: 12}
    velocity:    {enabled: true, ban-at: 10}
    reach:       {enabled: true, ban-at: 10}
    killaura:    {enabled: true, ban-at: 10}
    noswing:     {enabled: true, ban-at: 10}
    wallhit:     {enabled: true, ban-at: 8}
    autoclicker: {enabled: true, ban-at: 0}
    mace:        {enabled: true, ban-at: 3}
    blockreach:  {enabled: true, ban-at: 8}
    interact:    {enabled: true, ban-at: 8}
    fastplace:   {enabled: true, ban-at: 12}
    nuker:       {enabled: true, ban-at: 8}
    chestaura:   {enabled: true, ban-at: 8}
    xray:        {enabled: true, ban-at: 0}
    inventory:   {enabled: true, ban-at: 0}

moderation:
  enabled: true
  # Who else sees punishments: staff (vigil.alerts), all, or none.
  broadcast: staff
  # Shown on ban screens. Put your Discord invite or website here.
  appeal: "Ask a staff member on our Discord"
  # How dates are shown on ban screens (Java date pattern).
  date-format: "dd MMM yyyy, HH:mm"
  # Used when no time is typed and the reason has no preset time.
  default-duration:
    ban: perm
    mute: perm
  # Automatic punishment when a player reaches a number of active warnings.
  warn-escalation:
    3: mute 1h
    5: ban 1d
    7: ban 7d
  # Every warning needs a time: /warn Steve 1d Spam. It stops counting after that time.
  warn-time:
    min: 1h
    max: 10d
  # Commands muted players cannot use.
  muted-blocked-commands: [msg, tell, w, whisper, r, reply, me, say, mail, m, t, pm, dm, message, emsg, etell, ewhisper, er, ereply]
  # Preset reasons with their time for the 1st, 2nd, 3rd... offence (the last one repeats).
  # "/ban Steve Cheating" = 7 days the first time, 30 days the second time, permanent after that.
  # A single time (e.g. "Doxxing: perm") is used every time. Underscores show as spaces.
  reasons:
    ban:
      Cheating: 7d, 30d, perm
      Hacked_Client: 14d, 30d, perm
      Kill_Aura: 14d, 30d, perm
      Fly_Hacks: 7d, 14d, 30d, perm
      Speed_Hacks: 7d, 14d, 30d, perm
      X-Ray: 7d, 14d, 30d, perm
      Reach: 7d, 14d, 30d, perm
      Auto_Clicker: 3d, 7d, 14d, 30d
      Mace_Exploit: 14d, 30d, perm
      Duping: 30d, perm
      Exploiting: 7d, 14d, 30d, perm
      Griefing: 3d, 7d, 30d, perm
      Stealing: 1d, 3d, 7d, 30d
      Scamming: 3d, 7d, 30d, perm
      Harassment: 3d, 7d, 30d, perm
      Hate_Speech: 7d, 30d, perm
      Threats: 14d, 30d, perm
      Doxxing: perm
      Advertising: 1d, 7d, 30d, perm
      Spam: 1d, 3d, 7d
      Inappropriate_Build: 1d, 3d, 7d, 30d
      Inappropriate_Skin: 1d, 3d, 7d
      Inappropriate_Name: perm
      Lag_Machine: 3d, 7d, 30d, perm
      Staff_Disrespect: 1d, 3d, 7d
      Ban_Evasion: perm
      Alt_Account: perm
      Chargeback: perm
    mute:
      Spam: 15m, 1h, 6h, 1d
      Chat_Flood: 15m, 1h, 6h, 1d
      Excessive_Caps: 10m, 30m, 1h, 6h
      Swearing: 30m, 2h, 1d, 7d
      Toxicity: 1h, 6h, 1d, 7d
      Harassment: 6h, 1d, 7d, 30d
      Hate_Speech: 1d, 7d, 30d, perm
      Threats: 1d, 7d, 30d, perm
      Advertising: 1h, 1d, 7d, 30d
      Inappropriate_Language: 30m, 2h, 1d, 7d
      Arguing_With_Staff: 30m, 2h, 1d
      Spoilers: 15m, 1h, 6h
      Begging: 30m, 2h, 1d
      Impersonation: 1d, 7d, 30d
      Politics_Or_Religion: 1h, 6h, 1d
    warn: [Spam, Excessive_Caps, Swearing, Toxicity, Harassment, Advertising, Inappropriate_Language, Arguing_With_Staff, Begging, Griefing, Stealing, Minor_Exploit, Inappropriate_Build, Unfair_PvP, Trapping, Ignoring_Staff, Build_Too_Close]
    kick: [AFK, Spam, Toxicity, Glitching, Inappropriate_Skin, Inappropriate_Name, Suspicious_Activity, Staff_Request, Server_Maintenance]
    unban: [Appeal_Accepted, False_Ban, Served_Time, Staff_Decision]
    unmute: [Appeal_Accepted, False_Mute, Served_Time, Staff_Decision]
    unwarn: [Appeal_Accepted, False_Warning, Staff_Decision]

# Discord: ban alerts, tickets, staff commands and chat. Setup steps are in the README.
discord:
  # Option 1, the simplest: a webhook posts bans, mutes, warnings and kicks to one channel.
  # Channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
  webhook: ""
  send-punishments: true
  send-auto-bans: true
  # Every anti-cheat alert through the webhook too (can be a lot).
  send-alerts: false
  # Option 2: a bot. Posts punishments and alerts, runs tickets, and gives staff /ban, /mute,
  # /lookup ... in Discord. When a bot channel below is set, the bot posts there instead of the webhook.
  bot:
    enabled: false
    # Discord developer portal > your application > Bot > Reset Token. Keep it secret.
    token: ""
    # Turn on Developer Mode (Discord settings > Advanced), then right-click your server > Copy Server ID.
    server-id: ""
    # Roles that may use the staff commands and see tickets (right-click a role > Copy Role ID).
    # Server admins always can.
    staff-roles: []
    # Channel IDs (right-click a channel > Copy Channel ID). Leave empty to turn one off.
    punishments-channel: ""
    # Every anti-cheat alert is posted here.
    alerts-channel: ""
    # Ticket channels are created in this category (right-click the category > Copy Category ID).
    tickets-category: ""
    # Closed tickets are logged here with the whole conversation.
    ticket-log-channel: ""
    # Two-way chat between Minecraft and this channel.
    chat-channel: ""
    # Read normal messages in ticket and chat channels. Needs "Message Content Intent" switched on
    # in the developer portal (Bot page). Without it, staff answer tickets with /reply.
    read-messages: true
    # Mention the staff roles when a ticket is opened.
    ping-staff: true
    # Shown under the bot's name. {online} = players online.
    status: "Watching {online} players"

# Support tickets: /ticket <message> in game, /report <player> <reason>, and the Discord ticket
# panel (/ticketpanel in Discord). Staff use /tickets in game, or the ticket channels in Discord.
tickets:
  enabled: true
  reports: true
  # Closed tickets are deleted after this long ("perm" keeps them).
  keep-closed: 30d

# Placeholders: {player} {staff} {reason} {duration} {expires} {expires-date} {date} {id} {offence} {appeal} {count} {vl} {brand}
messages:
  # The plugin's name on ban messages. Use it anywhere as {brand}.
  # Colours: &c, &#FF8800 (hex) or <gradient:#FF3C3C:#FFA53C>text</gradient> (two or more colours).
  brand: "<gradient:#FF3C3C:#FFA53C>&lVɪɢɪʟ</gradient>"
  flagged: "&f{player} &7has been flagged for &c{reason} &8(VL {vl})"
  # Shown to everyone when the anti-cheat bans someone.
  auto-banned:
    - "&8&m                                                  "
    - "  {brand} &8&l| &7Anti-Cheat"
    - ""
    - "  &f{player} &7has been banned for cheating."
    - "  &7Detected: &c{reason}"
    - "&8&m                                                  "
  # Big text on the cheater's screen during the ban animation.
  ban-title: "&c&lBanned"
  ban-subtitle: "&7Detected: &c{reason}"
  # Kick screen for hacked clients and world downloaders.
  client-blocked:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - "&8&m                                    "
    - "&cYour client is not allowed on this server."
    - ""
    - "&7Detected: &f{client}"
    - "&7Please reconnect using an unmodified Minecraft client."
    - "&8&m                                    "
  client-blocked-alert: "&f{player} &7was disconnected for using &c{client}&7."
  alerts-enabled: "&aAnti-cheat alerts enabled."
  alerts-disabled: "&eAnti-cheat alerts disabled."
  reloaded: "&aConfiguration reloaded. &7({warnings} warning(s), see console)"
  reload-failed: "&cReload failed, previous configuration kept: &f{error}"
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  no-reason: "No Reason"
  permanent: "Permanent"
  ban-success: "&7You have banned player &b{player} &7for &b{reason} &7for &b{duration}&7. &8({offence} offence, #{id})"
  unban-success: "&7You have unbanned player &b{player} &7for &b{reason}&7."
  mute-success: "&7You have muted player &b{player} &7for &b{reason} &7for &b{duration}&7. &8({offence} offence, #{id})"
  unmute-success: "&7You have unmuted player &b{player} &7for &b{reason}&7."
  warn-success: "&7You have warned player &b{player} &7for &b{reason} &7for &b{duration}&7. &8(active warnings: {count}, #{id})"
  unwarn-success: "&7You have removed a warning from &b{player} &7for &b{reason}&7. &8(active warnings: {count})"
  kick-success: "&7You have kicked player &b{player} &7for &b{reason}&7."
  ban-broadcast: "&b{staff} &7banned &b{player} &7for &b{reason} &7for &b{duration}&7."
  unban-broadcast: "&b{staff} &7unbanned &b{player} &7for &b{reason}&7."
  mute-broadcast: "&b{staff} &7muted &b{player} &7for &b{reason} &7for &b{duration}&7."
  unmute-broadcast: "&b{staff} &7unmuted &b{player} &7for &b{reason}&7."
  warn-broadcast: "&b{staff} &7warned &b{player} &7for &b{reason} &7for &b{duration}&7."
  unwarn-broadcast: "&b{staff} &7removed a warning from &b{player} &7for &b{reason}&7."
  kick-broadcast: "&b{staff} &7kicked &b{player} &7for &b{reason}&7."
  # Shown to a banned player who tries to join (temporary ban).
  ban-screen:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - "&8&m                                    "
    - "&cYou are banned from this server."
    - "&7Time remaining: &f{expires}"
    - ""
    - "&7Reason: &f{reason} &8({offence} offence)"
    - "&7Banned by: &f{staff}"
    - "&7Date: &f{date}"
    - "&7Expires: &f{expires-date}"
    - "&7Ban ID: &f#{id}"
    - ""
    - "&7Appeal: &b{appeal}"
    - "&8&m                                    "
  # Permanent bans.
  ban-screen-permanent:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - "&8&m                                    "
    - "&cYou are permanently banned from this server."
    - ""
    - "&7Reason: &f{reason} &8({offence} offence)"
    - "&7Banned by: &f{staff}"
    - "&7Date: &f{date}"
    - "&7Ban ID: &f#{id}"
    - ""
    - "&7Appeal: &b{appeal}"
    - "&8&m                                    "
  # Bans given automatically by the anti-cheat.
  ban-screen-anticheat:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - "&8&m                                    "
    - "&cYou have been banned by {brand}&c."
    - ""
    - "&7Detected: &f{reason}"
    - "&7Length: &f{duration} &8({offence} offence)"
    - "&7Date: &f{date}"
    - "&7Expires: &f{expires-date}"
    - "&7Ban ID: &f#{id}"
    - ""
    - "&7If you believe this is a mistake, you may appeal: &b{appeal}"
    - "&8&m                                    "
  kick-screen:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - "&8&m                                    "
    - "&eYou have been kicked from this server."
    - ""
    - "&7Reason: &f{reason}"
    - "&7Kicked by: &f{staff}"
    - ""
    - "&7You may reconnect at any time."
    - "&8&m                                    "
  mute-notify: "&cYou have been muted for &f{reason}&c. &7Length: &f{duration} &8(until {expires-date})"
  muted-chat: "&cYou are muted for &f{reason}&c. &7Unmuted in &f{expires}&7."
  unmute-notify: "&aYou have been unmuted."
  warn-notify: "&cYou have been warned for &f{reason}&c. &7This warning expires in &f{duration}&7. &8(active warnings: {count})"
  unwarn-notify: "&aOne of your warnings has been removed. &7(active warnings: {count})"
  # Shown in bold above the hotbar for a few seconds ("" = off).
  mute-actionbar: "&c&lYou have been muted for {reason}"
  unmute-actionbar: "&a&lYou have been unmuted"
  warn-actionbar: "&c&lYou have been warned for {reason}"
  unwarn-actionbar: "&a&lA warning has been removed"
  # /warn without a valid time. {min} and {max} come from moderation.warn-time.
  warn-time-required: "&cA warning needs a time between &f{min} &cand &f{max}&c, for example: &f/warn {player} 1d Spam"
  not-banned: "&c{player} is not banned."
  not-muted: "&c{player} is not muted."
  not-warned: "&c{player} has no active warnings."
  cannot-punish: "&cYou cannot punish {player}."
  moderation-disabled: "&cModeration commands are disabled in the configuration."
  never: "Never"
  presets-header: "&7Preset reasons &8(time for the 1st, 2nd, 3rd offence...)&7:"
  warn-escalation-reason: "Too many warnings ({count})"
  # Tickets. Placeholders: {id} {player} {author} {message} {category} {staff} {reason} {count}
  ticket-usage: "&7Need help? Open a ticket with staff: &f/ticket <message>"
  ticket-opened: "&aYour ticket &f#{id} &ahas been opened. Staff will reply as soon as possible."
  ticket-added: "&7Your message was added to ticket &f#{id}&7."
  ticket-reply: "&8[&bTicket #{id}&8] &f{author}&7: &f{message}"
  ticket-staff-new: "&8[&bTicket #{id}&8] &f{player} &7opened a ticket &8({category})&7: &f{message}"
  ticket-staff-message: "&8[&bTicket #{id}&8] &f{author}&7: &f{message}"
  ticket-claimed: "&7Ticket &f#{id} &7is now handled by &f{staff}&7."
  ticket-closed: "&7Ticket &f#{id} &7has been closed."
  ticket-closed-notify: "&7Your ticket &f#{id} &7was closed by &f{staff}&7. &8({reason})"
  ticket-none: "&7You have no open tickets."
  ticket-not-found: "&cTicket not found: &f{id}"
  ticket-choose: "&7You have more than one open ticket. Add its number, for example: &f/ticket reply {id} <message>"
  ticket-unread: "&7You have a new reply on ticket &f#{id}&7. Use &f/ticket view {id} &7to read it."
  ticket-cooldown: "&cPlease wait a moment before sending another message."
  ticket-full: "&cThis ticket is full. Please open a new one."
  ticket-too-many: "&cYou already have {count} open tickets. Please wait for staff to answer them."
  tickets-header: "&7Open tickets &8({count})&7:"
  tickets-empty: "&7There are no open tickets."
  tickets-open-join: "&7Open tickets waiting for staff: &f{count}&7. Use &f/tickets &7to see them."
  tickets-disabled: "&cTickets are turned off on this server."
  report-usage: "&7Report a player to staff: &f/report <player> <reason>"
  report-sent: "&aThank you. Your report about &f{player} &ahas been sent to staff as ticket &f#{id}&a."
  report-self: "&cYou cannot report yourself."
  # Discord chat shown in game (discord.bot.chat-channel). Placeholders: {name} {message}
  discord-chat: "&9Discord &8| &f{name}&7: {message}"

# Fine-tuning (lag protection, per-check thresholds...) is optional and described in the README.
