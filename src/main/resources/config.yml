# ============================================================
#  Vigil - anti-cheat and moderation for Vanilla SMP
#  Commands: /ac  /ban  /unban  /mute  /unmute  /warn  /kick
#  After editing, run /ac reload.
# ============================================================
config-version: 2

# Shown in front of every message.
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

anticheat:
  enabled: true
  # Staff with vigil.alerts see "Steve has been flagged for Flying".
  alerts: true
  auto-ban:
    enabled: true
    # How long automatic bans last (e.g. 7d, 30d, perm).
    duration: 30d
    # {reason} = what was detected, e.g. "Flying".
    reason: "Cheating ({reason})"
    # Tell every player about the ban (staff are always told).
    broadcast: true
    # Leave empty to use Vigil's own bans. To use another ban plugin instead, e.g.:
    # command: "tempban {player} {duration} {reason}"
    command: ""
  # Creative and spectator players are never checked.
  exempt-creative-and-spectator: true
  # Worlds where nothing is checked.
  disabled-worlds: []
  # Let players with vigil.bypass skip all checks. Off so "*" permissions don't disable the anti-cheat.
  bypass-permission: false
  # Anti x-ray: switches on Paper's own anti-xray once (fake ores hide the real ones from x-ray and ore ESP).
  # Backups are made and a restart is needed. If you turn it off afterwards, Vigil leaves it off.
  setup-paper-anti-xray: true
  # Anti ESP / anti freecam: chests, barrels, shulkers, beds... that a player cannot see are shown as stone
  # to that player until they get close or can see them (Paper).
  hide-storage-from-esp: true

  # enabled: turn a check on/off.
  # ban-at: violation level that bans automatically (0 = alert only, never ban; x-ray is a pattern, not proof).
  # Each flag adds 1 and 1 decays per minute, so short false flags never add up.
  checks:
    speed:       {enabled: true, ban-at: 15}
    flight:      {enabled: true, ban-at: 8}
    step:        {enabled: true, ban-at: 8}
    nofall:      {enabled: true, ban-at: 10}
    timer:       {enabled: true, ban-at: 10}
    noslow:      {enabled: true, ban-at: 12}
    velocity:    {enabled: true, ban-at: 10}
    reach:       {enabled: true, ban-at: 10}
    killaura:    {enabled: true, ban-at: 10}
    noswing:     {enabled: true, ban-at: 10}
    wallhit:     {enabled: true, ban-at: 8}
    autoclicker: {enabled: true, ban-at: 0}
    mace:        {enabled: true, ban-at: 3}
    blockreach:  {enabled: true, ban-at: 8}
    interact:    {enabled: true, ban-at: 8}
    fastplace:   {enabled: true, ban-at: 12}
    nuker:       {enabled: true, ban-at: 8}
    chestaura:   {enabled: true, ban-at: 8}
    xray:        {enabled: true, ban-at: 0}

moderation:
  enabled: true
  # Who else sees punishments: staff (vigil.alerts), all, or none.
  broadcast: staff
  # Used when no duration is typed and the reason has no preset duration.
  default-duration:
    ban: perm
    mute: perm
  # Commands muted players cannot use.
  muted-blocked-commands: [msg, tell, w, whisper, r, reply, me, say, mail, m, t, pm, dm, message, emsg, etell, ewhisper, er, ereply]
  # Preset reasons: "/ban Steve Cheating" bans for 30 days. Underscores show as spaces.
  reasons:
    ban:
      Cheating: 30d
      Hacked_Client: 30d
      Kill_Aura: 30d
      Fly_Hacks: 14d
      Speed_Hacks: 14d
      X-Ray: 14d
      Reach: 14d
      Auto_Clicker: 7d
      Duping: 30d
      Exploiting: 14d
      Griefing: 7d
      Stealing: 3d
      Scamming: 7d
      Harassment: 7d
      Hate_Speech: 30d
      Threats: 30d
      Doxxing: perm
      Advertising: 7d
      Spam: 1d
      Inappropriate_Build: 3d
      Inappropriate_Skin: 1d
      Inappropriate_Name: perm
      Lag_Machine: 7d
      Staff_Disrespect: 3d
      Ban_Evasion: perm
      Alt_Account: perm
      Chargeback: perm
    mute:
      Spam: 30m
      Chat_Flood: 30m
      Excessive_Caps: 15m
      Swearing: 30m
      Toxicity: 1h
      Harassment: 6h
      Hate_Speech: 7d
      Threats: 7d
      Advertising: 1d
      Inappropriate_Language: 1h
      Arguing_With_Staff: 30m
      Spoilers: 15m
      Begging: 30m
      Impersonation: 1d
      Politics_Or_Religion: 1h
    warn: [Spam, Excessive_Caps, Swearing, Toxicity, Harassment, Advertising, Inappropriate_Language, Arguing_With_Staff, Begging, Griefing, Stealing, Minor_Exploit, Inappropriate_Build, Unfair_PvP, Trapping, Ignoring_Staff, Build_Too_Close]
    kick: [AFK, Spam, Toxicity, Glitching, Inappropriate_Skin, Inappropriate_Name, Suspicious_Activity, Staff_Request, Server_Maintenance]
    unban: [Appeal_Accepted, False_Ban, Served_Time, Staff_Decision]
    unmute: [Appeal_Accepted, False_Mute, Served_Time, Staff_Decision]

# Placeholders: {player} {staff} {reason} {duration} {expires} {count} {vl}
messages:
  flagged: "&f{player} &7has been flagged for &c{reason} &8(VL {vl})"
  auto-banned: "&c{player} &7has been banned for &c{reason}&7."
  ban-success: "&7You have banned player &b{player} &7for &b{reason} &7for &b{duration}&7."
  unban-success: "&7You have unbanned player &b{player} &7for &b{reason}&7."
  mute-success: "&7You have muted player &b{player} &7for &b{reason} &7for &b{duration}&7."
  unmute-success: "&7You have unmuted player &b{player} &7for &b{reason}&7."
  warn-success: "&7You have warned player &b{player} &7for &b{reason}&7. &8(warning #{count})"
  kick-success: "&7You have kicked player &b{player} &7for &b{reason}&7."
  ban-broadcast: "&b{staff} &7banned &b{player} &7for &b{reason} &7for &b{duration}&7."
  unban-broadcast: "&b{staff} &7unbanned &b{player} &7for &b{reason}&7."
  mute-broadcast: "&b{staff} &7muted &b{player} &7for &b{reason} &7for &b{duration}&7."
  unmute-broadcast: "&b{staff} &7unmuted &b{player} &7for &b{reason}&7."
  warn-broadcast: "&b{staff} &7warned &b{player} &7for &b{reason}&7."
  kick-broadcast: "&b{staff} &7kicked &b{player} &7for &b{reason}&7."
  ban-screen:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - ""
    - "&cYou are banned from this server."
    - ""
    - "&7Reason: &f{reason}"
    - "&7Duration: &f{duration}"
    - "&7Expires in: &f{expires}"
    - "&7Banned by: &f{staff}"
  kick-screen:
    - "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ"
    - ""
    - "&cYou were kicked from this server."
    - ""
    - "&7Reason: &f{reason}"
    - "&7Kicked by: &f{staff}"
  mute-notify: "&cYou have been muted for &f{reason}&c. &7Duration: &f{duration}"
  muted-chat: "&cYou are muted for &f{reason}&c. &7Expires in: &f{expires}"
  unmute-notify: "&aYou have been unmuted."
  warn-notify: "&cYou have been warned for &f{reason}&c. &7(warning #{count})"
  no-reason: "No Reason"
  permanent: "Permanent"
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  not-banned: "&c{player} is not banned."
  not-muted: "&c{player} is not muted."
  cannot-punish: "&cYou cannot punish {player}."
  alerts-enabled: "&aAnti-cheat alerts enabled."
  alerts-disabled: "&eAnti-cheat alerts disabled."
  reloaded: "&aConfiguration reloaded. &7({warnings} warning(s), see console)"
  reload-failed: "&cReload failed, previous configuration kept: &f{error}"
  moderation-disabled: "&cModeration commands are disabled in the configuration."

# Fine-tuning (lag protection, per-check thresholds...) is optional and described in the README.
