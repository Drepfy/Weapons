# Combat. After editing, run /combat reload.
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

combat:
  # How long a player stays in combat after the last hit (given or taken).
  duration: 60s
  # Killing a player who wears armor ends your combat with them. Killing a naked player does not.
  #   armor-pieces: a helmet, chestplate, leggings or boots counts as armor (an elytra, pumpkin
  #                 or head does not)
  #   any-item:     anything in those four slots counts
  armor: armor-pieces
  # Logging out never ends combat: the timer is paused and continues when the player is back.
  #   keep: nothing else happens
  #   kill: the player also dies where they logged out and drops their items (default; not when they
  #         are kicked or the server stops)
  logout: kill
  # No commands in combat (/tpa, /rtp, /spawn, /ah...). The ones listed in allowed-commands
  # still work. Staff with the permission combat.bypass.commands can use every command.
  block-commands: true
  allowed-commands: [combat, ct, combattag]
  # Throwing an Ender Pearl in combat starts the combat time again (back to 60 seconds).
  pearl-resets-timer: true
  # No elytra gliding in combat. Players already gliding come down.
  elytra:
    blocked: true
    # Only while a player you are fighting is within this many blocks. 0 = for the whole combat.
    radius: 15
  # No riptide tridents in combat (throwing tridents as a weapon is still fine).
  riptide:
    blocked: true
    radius: 15

ender-pearl:
  # Time between two Ender Pearls, per player. 0s = no cooldown.
  cooldown: 15s
  # Show the cooldown on the pearl in the hotbar (the grey sweep).
  show-on-item: true

# Safe zones, such as spawn: players in combat cannot get in by walking, flying, riding,
# Ender Pearls, chorus fruit, portals or teleports (/spawn, /tpa...). Players already inside
# can stay and leave. Make one in game with /combat zone create spawn 50 (50 blocks out from
# where you stand, every direction, full height), or stand on one corner and use /combat zone pos1,
# on the opposite corner /combat zone pos2, then /combat zone create spawn. Zones are kept in zones.yml.
safe-zones:
  # Show a red wall of particles to players in combat who come close.
  show-border: true
  border-distance: 8

# {seconds} = seconds left. Set a message to "" to turn it off.
messages:
  # Above the hotbar while in combat, updated every second.
  action-bar: "&c⚔ Combat: &f{seconds}s"
  combat-start: "&cYou are in combat. Logging out will not end it."
  combat-end: "&aYou are no longer in combat."
  combat-rejoin: "&cYou are still in combat: &f{seconds}s&c left."
  combat-logout-kill: "&c{player} logged out during combat and died."
  command-blocked: "&cYou cannot use commands in combat. &7({seconds}s left)"
  pearl-cooldown: "&cYou can use an Ender Pearl again in &f{seconds}s&c."
  elytra-blocked: "&cYou cannot glide with an elytra in combat."
  riptide-blocked: "&cYou cannot use riptide in combat."
  zone-blocked: "&cYou cannot enter &f{zone} &cin combat. &7({seconds}s left)"
  status-combat: "&7Combat: &c{seconds}s left"
  status-no-combat: "&7Combat: &anot in combat"
  status-pearl: "&7Ender Pearl: &c{seconds}s"
  status-pearl-ready: "&7Ender Pearl: &aready"
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  reloaded: "&aCombat reloaded. &7({warnings} warning(s), see console)"
