# Legendary Weapons. After editing, run /legendary reload.
#
# Controls: F (the swap-offhand key) uses a weapon's first ability, Shift + F its second.
# Times: 8s, 2.5s, 1m, 30d.
config-version: 2
prefix: "&b&lᴠᴀɴɪʟʟᴀ sᴍᴘ » &r"

# Which keys use the abilities:
#   offhand     - F and Shift + F. The weapon stays in your hand (it is not swapped).
#   right-click - right-click and sneak + right-click (how 1.0 worked).
#   both        - either.
# The lore shows the right keys by itself ({key} and {sneak-key}).
controls: offhand

# Only one of each weapon can exist. /legendary give refuses a second Kurogane while the first
# is still around; remove it first (/legendary remove), or give a new one if it was lost.
one-of-each: true

# Legendaries always drop on the ground when their holder dies, even with keepInventory on,
# so they can be won. They never go into grave or death-chest plugins either way.
# false = they follow keepInventory (kept when it is on, dropped on the ground when it is off).
drop-on-death: true

# Stops a legendary being passed between accounts of the same person (alts used as storage):
# a weapon dropped by, or taken from, an account cannot be picked up by another account that
# joined from the same IP address. Give a player legendary.bypass.alts to allow it (siblings).
alt-protection:
  enabled: true
  # How long a player's IP addresses are remembered (only salted hashes are stored).
  remember-ip: 30d
  # An address used by more accounts than this is a shared network (school, hotel): ignored.
  max-accounts-per-ip: 3

# Commands that sell or list the held item (shops, auction houses): refused while a legendary
# is in either hand. Other items can still be sold. Commands that sell the whole inventory
# (sellall, sell all) are refused while carrying a legendary anywhere.
# Matched against the start of the command, without the slash.
blocked-commands:
  - "ah sell"
  - "ah list"
  - "auction sell"
  - "auctionhouse sell"
  - "sell"
  - "sellhand"
  - "sellall"

# What the abilities hit besides players: hostile (monsters), all (every mob) or none.
hit-mobs: hostile

display:
  # A boss bar for each ability while holding a legendary: its name and how long until it can
  # be used again (the bar fills up as it recharges).
  boss-bars: true

# Each weapon: its name and lore ({key} / {sneak-key} = the keys that use its abilities,
# {<ability>.<setting>} = a value below, such as {crimson-flash.cooldown}, {<ability>.name} = the
# ability's name, {enchantments} = the enchantments listed in the weapon's style), resource pack
# looks, enchantments and abilities. Damage is in health points (2 = one heart) and is reduced by
# armour like a sword hit. An ability can be renamed with "name:" in its section.
#
# item-model and tooltip-style come from the server resource pack (1.21.4+ clients): the 3D
# model, and the weapon's own tooltip frame. Without the pack, tooltip styles show as a missing
# texture: if players may join without it (require-resource-pack=false), set them to "".
# glint: the enchantment shine (off: the models have their own glowing parts).
weapons:
  kurogane:
    name: "<gradient:#F5F5F5:#C21E3A>&lKurogane</gradient>"
    custom-model-data: 1001
    item-model: "legendary:kurogane"
    tooltip-style: "legendary:kurogane"
    glint: false
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      # pink, blue, red, green, yellow, purple or white
      color: red
      text: "&#FF4D6A"
    lore:
      - "&8Legendary Katana"
      - ""
      - "&#FF4D6A{key} &8» &f{crimson-flash.name} &8({crimson-flash.cooldown})"
      - "&7Dash through enemies. They bleed."
      - ""
      - "&#FF4D6A{sneak-key} &8» &f{blood-moon.name} &8({blood-moon.cooldown})"
      - "&7Your hits cut twice and heal you."
      - ""
      - "{enchantments}"
    abilities:
      crimson-flash:
        cooldown: 20s
        # How far the dash goes (it stops at walls) and how wide its cut is.
        range: 8
        width: 1.6
        damage: 7
        # The cut lands this long after the dash.
        delay: 0.5s
        # Bleeding afterwards: this much damage every second, for this long (0 = none).
        bleed-damage: 1
        bleed-duration: 3s
      blood-moon:
        cooldown: 35s
        duration: 6s
        # Each sword hit while it lasts: extra damage, and health back (2 = one heart).
        bonus-damage: 3
        heal: 1
        # Hits closer together than this do not cut twice (no spam clicking).
        min-hit-gap: 0.5s

  sugarcrash:
    name: "<gradient:#FF3B5C:#FFFFFF:#FF3B5C>&lSugarcrash</gradient>"
    custom-model-data: 1002
    item-model: "legendary:sugarcrash"
    tooltip-style: "legendary:sugarcrash"
    glint: false
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: pink
      text: "&#FF7AC3"
    lore:
      - "&8Legendary Candy Scythe"
      - ""
      - "&#FF7AC3{key} &8» &f{sugar-rush.name} &8({sugar-rush.cooldown})"
      - "&7Dash through players, then speed up."
      - ""
      - "&#FF7AC3{sneak-key} &8» &f{candy-cyclone.name} &8({candy-cyclone.cooldown})"
      - "&7Spin a candy tornado that shreds."
      - ""
      - "{enchantments}"
    abilities:
      sugar-rush:
        cooldown: 18s
        # How fast and how long the dash is.
        dash-speed: 1.6
        dash-time: 0.4s
        # Players you dash through.
        damage: 4
        knockback: 0.9
        lift: 0.35
        # Then: Speed and Haste (faster swings) for this long. Level 0 = none.
        buff-duration: 5s
        speed-level: 2
        haste-level: 2
      candy-cyclone:
        cooldown: 30s
        duration: 3s
        radius: 4
        # Every interval, players in the tornado take this and are dragged in.
        damage: 1.5
        interval: 0.5s
        pull: 0.22
        # When it ends it bursts, throwing everyone out.
        burst-damage: 3
        burst-knockback: 1.1
        burst-lift: 0.45

  riftblade:
    name: "<gradient:#E9C6FF:#A855F7>&lRiftblade</gradient>"
    custom-model-data: 1003
    item-model: "legendary:riftblade"
    tooltip-style: "legendary:riftblade"
    glint: false
    unbreakable: true
    enchantments:
      sharpness: 7
      fire_aspect: 2
      looting: 3
      sweeping_edge: 3
    boss-bar:
      color: purple
      text: "&#B76BFF"
    lore:
      - "&8Legendary Void Sword"
      - ""
      - "&#B76BFF{key} &8» &f{void-rend.name} &8({void-rend.cooldown})"
      - "&7Tear a rift that pulls and blinds."
      - ""
      - "&#B76BFF{sneak-key} &8» &f{rift-swap.name} &8({rift-swap.cooldown})"
      - "&7Swap places with who you look at."
      - ""
      - "{enchantments}"
    abilities:
      void-rend:
        cooldown: 22s
        # The rift opens this far ahead (or at a wall).
        distance: 5
        # For pull-time it drags in everyone within pull-radius...
        pull-radius: 5
        pull: 0.25
        pull-time: 1s
        # ...then snaps shut: damage and Darkness for everyone within radius.
        radius: 3
        damage: 7
        darkness: 2s
      rift-swap:
        cooldown: 30s
        # Swaps with the first player (or monster) in sight within range.
        range: 18
        damage: 2
        nausea: 3s
        # With nobody in sight: blink this far forward instead.
        blink: 10

  gravebreaker:
    name: "<gradient:#E2E2E2:#E0475A>&lGravebreaker</gradient>"
    custom-model-data: 1004
    item-model: "legendary:gravebreaker"
    tooltip-style: "legendary:gravebreaker"
    glint: false
    unbreakable: true
    enchantments:
      sharpness: 7
      efficiency: 5
      fortune: 3
    boss-bar:
      color: yellow
      text: "&#FF8A3D"
    lore:
      - "&8Legendary Battle Axe"
      - ""
      - "&#FF8A3D{key} &8» &f{executioners-leap.name} &8({executioners-leap.cooldown})"
      - "&7Leap up and slam the ground."
      - ""
      - "&#FF8A3D{sneak-key} &8» &f{grave-rise.name} &8({grave-rise.cooldown})"
      - "&7Gravestones burst out of the ground."
      - ""
      - "{enchantments}"
    abilities:
      executioners-leap:
        cooldown: 20s
        # How high and how far forward the leap throws you (you take no fall damage from it).
        leap-up: 1.1
        leap-forward: 0.9
        # The slam: damage at the centre, falling to edge-damage at the edge of the radius.
        radius: 5
        damage: 8
        edge-damage: 4
        launch: 0.7
        push: 0.6
        # Slowness level and how long it lasts (0 = none).
        slow-level: 2
        slow-duration: 2s
      grave-rise:
        cooldown: 30s
        # The line of gravestones: how far it reaches, how many, and the time between them.
        range: 12
        stones: 6
        interval: 0.2s
        width: 1.4
        damage: 6
        launch: 0.9
        # Mining Fatigue level and how long it lasts (0 = none).
        fatigue-level: 2
        fatigue-duration: 3s

  starforged:
    name: "<gradient:#FFE29A:#6FD6FF:#8A5CFF>&lStarforged</gradient>"
    custom-model-data: 1005
    item-model: "legendary:starforged"
    tooltip-style: "legendary:starforged"
    glint: false
    unbreakable: true
    enchantments:
      sharpness: 7
      efficiency: 5
      fortune: 3
    boss-bar:
      color: blue
      text: "&#6FD6FF"
    lore:
      - "&8Legendary Celestial Axe"
      - ""
      - "&#6FD6FF{key} &8» &f{starfall.name} &8({starfall.cooldown})"
      - "&7Call down a rain of stars."
      - ""
      - "&#6FD6FF{sneak-key} &8» &f{singularity.name} &8({singularity.cooldown})"
      - "&7A black hole pulls, then explodes."
      - ""
      - "{enchantments}"
    abilities:
      starfall:
        cooldown: 25s
        range: 24
        # Time between the rune circle appearing and the first star (at least 0.5s).
        warning: 1.25s
        radius: 4.5
        stars: 6
        interval: 0.2s
        # Each star: who is within star-radius of where it lands.
        star-radius: 2
        damage: 4
        # A player is hit by at most this many stars of one Starfall.
        max-hits: 3
        launch: 0.6
      singularity:
        cooldown: 35s
        range: 20
        radius: 7
        duration: 3s
        # How hard players are dragged to the centre (they can still walk out slowly).
        pull: 0.16
        # A player caught by it takes this once (it is what lets protection plugins keep players
        # in no-PvP areas out of it).
        grip-damage: 1
        nova-damage: 6
        nova-knockback: 1.3
        nova-lift: 0.5
        # Starfall cannot be used while a Singularity is open (plus this long), and Singularity
        # cannot be used while stars are falling (plus this long).
        lockout: 1.5s

# Sounds: "<sound> [volume] [pitch]". The legendary:... sounds are in the server resource pack;
# the quiet vanilla sound after them is for players without it.
sounds:
  crimson-flash: ["legendary:kurogane.flash 1 1", "entity.player.attack.sweep 0.3 1.5"]
  crimson-flash-end: ["legendary:kurogane.sheathe 0.9 1"]
  crimson-cut: ["legendary:kurogane.cut 1 1", "entity.player.attack.crit 0.3 1.2"]
  kurogane-hit: ["legendary:kurogane.hit 0.9 1"]
  bleed: ["legendary:kurogane.bleed 0.5 1"]
  blood-moon: ["legendary:kurogane.blood_moon 1 1", "entity.wither.ambient 0.15 1.6"]
  blood-moon-cut: ["legendary:kurogane.moon_cut 0.9 1", "entity.player.attack.sweep 0.25 1.7"]
  sugar-rush: ["legendary:sugarcrash.rush 1 1", "entity.firework_rocket.launch 0.3 1.6"]
  sugar-rush-end: ["legendary:sugarcrash.sparkle 0.6 1"]
  sugarcrash-hit: ["legendary:sugarcrash.hit 0.9 1", "block.amethyst_cluster.break 0.3 1.5"]
  candy-cyclone: ["legendary:sugarcrash.cyclone 1 1", "entity.breeze.wind_burst 0.2 1.3"]
  candy-cyclone-hit: ["legendary:sugarcrash.pop 0.6 1"]
  candy-burst: ["legendary:sugarcrash.burst 1 1", "entity.firework_rocket.blast 0.35 1.3"]
  void-rend: ["legendary:riftblade.rend 1 1", "entity.enderman.teleport 0.3 0.6"]
  void-rend-snap: ["legendary:riftblade.snap 1 1", "entity.evoker.cast_spell 0.25 0.6"]
  riftblade-hit: ["legendary:riftblade.hit 0.9 1"]
  rift-swap: ["legendary:riftblade.swap 1 1", "entity.enderman.teleport 0.3 1.3"]
  executioners-leap: ["legendary:gravebreaker.leap 1 1", "entity.breeze.jump 0.25 0.7"]
  executioners-slam: ["legendary:gravebreaker.slam 1 1", "entity.generic.explode 0.3 0.6"]
  gravebreaker-hit: ["legendary:gravebreaker.hit 0.9 1"]
  grave-rise: ["legendary:gravebreaker.rumble 1 1"]
  grave-rise-stone: ["legendary:gravebreaker.stone 0.9 1", "block.deepslate.break 0.35 0.7"]
  starfall: ["legendary:starforged.call 1 1", "block.beacon.activate 0.3 1.6"]
  starfall-star: ["legendary:starforged.fall 0.8 1"]
  starfall-impact: ["legendary:starforged.impact 1 1", "entity.firework_rocket.twinkle 0.3 1.2"]
  starforged-hit: ["legendary:starforged.hit 0.9 1"]
  singularity: ["legendary:starforged.singularity 0.8 1", "block.portal.trigger 0.12 1.4"]
  singularity-nova: ["legendary:starforged.nova 1 1", "entity.generic.explode 0.3 1.3"]
  # Getting a legendary.
  received: ["ui.toast.challenge_complete 0.6 1.2"]

# {ability}, {time}, {player}, {weapon}... are filled in. Set a message to "" to turn it off.
messages:
  # The boss bars ({color} = the weapon's boss-bar text colour).
  bar-ready: "{color}&l{ability}"
  bar-cooldown: "{color}{ability} &8» &f{time}"
  bar-active: "{color}&l{ability} &8» &e{time}"
  # How {enchantments} lists them in the lore.
  lore-enchantment: "&#AFB6C2{name} &f{level}"
  lore-separator: "  &8✦  "
  lore-unbreakable: "&#AFB6C2Unbreakable"
  # Above the hotbar.
  no-target: "&7Nothing to aim at within {range} blocks."
  swap-refused: "&cThe rift can't take you there."
  # In chat.
  storage-blocked: "&cLegendaries can't go in containers."
  placing-blocked: "&cLegendaries can't be placed there."
  bundle-blocked: "&cLegendaries can't go in bundles."
  command-blocked: "&cYou can't use that while carrying a legendary."
  alt-blocked: "&cYou can't pick this up: legendaries can't move between your own accounts."
  copy-removed: "&cA copy of {weapon} &cwas removed. Legendaries can't be duplicated."
  revoked: "&c{weapon} &cwas taken away by staff."
  container-returned: "{weapon} &ewas moved from storage to your inventory."
  received: "&6You got {weapon}&6!"
  dropped-at-feet: "&eYour inventory is full: {weapon} &ewas dropped at your feet."
  # Staff.
  alert: "&8[&6Legendary&8] &7{message}"
  given: "&aGave {weapon} &ato &f{player}&a. &7(#{id})"
  give-exists: "&c{weapon} &calready exists: {where}. Remove it first with &f/legendary remove {holder} {key}&c."
  removed: "&aRemoved {weapon} &a(#{id}) from &f{player}&a."
  removed-offline: "&aTook {weapon} &a(#{id}) from &f{player}&a. It disappears from their inventory when they next join."
  removed-everywhere: "&aRemoved {weapon} &aeverywhere. &7({count} found)"
  removed-none: "&c{player} does not have {weapon}&c."
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: &f{player}"
  unknown-weapon: "&cUnknown weapon: &f{weapon}&c. Weapons: &f{weapons}"
  reloaded: "&aLegendary reloaded. &7({warnings} warning(s), see console)"
